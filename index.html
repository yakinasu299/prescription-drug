<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>横浜こころとねむりのクリニック 院内薬剤検索</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap');

:root {
  --green: #72ad96;
  --green-dark: #4f9279;
  --green-light: #eaf5ef;
  --blue: #8bbbd0;
  --blue-light: #edf5f9;
  --ink: #344b48;
  --muted: #82938e;
  --line: #e3ede8;
  --white: #fff;
  --danger: #e53e3e;
  --danger-light: #fff5f5;
  --danger-border: #fed7d7;
  --warning: #dd6b20;
  --warning-light: #fffaf0;
  --warning-border: #fbd38d;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 28px 18px;
  background:
    radial-gradient(circle at 10% 5%, #e4f2ec 0, transparent 30%),
    radial-gradient(circle at 95% 90%, #e6f0f6 0, transparent 30%),
    #f7faf9;
  color: var(--ink);
  font-family: "Noto Sans JP", sans-serif;
}

button, input { font: inherit; }

.container {
  width: min(100%, 900px);
  margin: 0 auto;
}

/* ヘッダー */
.header {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 190px;
  padding: 34px 42px;
  overflow: hidden;
  border: 1px solid #dcece5;
  border-radius: 28px;
  background: linear-gradient(115deg, #e8f5ee, #eaf3f8);
}

.header-copy { position: relative; z-index: 1; }

.header-label {
  margin: 0 0 8px;
  color: var(--green-dark);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .16em;
}

.header h1 {
  margin: 0;
  font-size: clamp(22px, 3.8vw, 32px);
  font-weight: 700;
  letter-spacing: .04em;
}

.header p.description {
  margin: 12px 0 0;
  color: #718781;
  font-size: 13px;
  line-height: 1.8;
}

/* 医療イラスト */
.illustration {
  position: relative;
  flex: 0 0 230px;
  height: 145px;
}

.medical-circle {
  position: absolute;
  top: 4px;
  right: 24px;
  width: 132px;
  height: 132px;
  border-radius: 50%;
  background: #d5eae0;
}

.medical-cross {
  position: absolute;
  top: 36px;
  right: 62px;
  width: 58px;
  height: 58px;
  color: white;
  font-size: 62px;
  font-weight: 400;
  line-height: 52px;
  text-align: center;
  z-index: 2;
}

.pill {
  position: absolute;
  z-index: 3;
  width: 72px;
  height: 29px;
  border: 4px solid white;
  border-radius: 30px;
  transform: rotate(-35deg);
  background: linear-gradient(90deg, #91cbb0 50%, #fff 50%);
  box-shadow: 0 5px 12px #658c7c20;
}

.pill-one { right: 120px; top: 92px; }
.pill-two {
  right: 4px;
  top: 105px;
  transform: rotate(28deg) scale(.8);
  background: linear-gradient(90deg, #9bc9dc 50%, #fff 50%);
}

.small-circle {
  position: absolute;
  right: 190px;
  top: 22px;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: #a6cfc0;
}

/* 検索 */
.search-card {
  position: relative;
  margin-top: 24px;
  padding: 30px 34px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: white;
  box-shadow: 0 8px 30px #527e6a0b;
}

.section-heading {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
  font-size: 15px;
  font-weight: 700;
}

.heading-icon {
  display: grid;
  width: 30px;
  height: 30px;
  place-items: center;
  border-radius: 10px;
  background: var(--green-light);
  color: var(--green-dark);
  font-size: 16px;
}

.search-box { position: relative; }

.search-box input {
  width: 100%;
  height: 60px;
  padding: 0 52px 0 20px;
  border: 1.5px solid #d8e8e0;
  border-radius: 14px;
  outline: none;
  background: #fbfdfc;
  color: var(--ink);
  font-size: 15px;
  transition: .2s;
}

.search-box input:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 4px #72ad961c;
  background: white;
}

.search-box input::placeholder { color: #a9b8b2; }

.search-icon {
  position: absolute;
  top: 50%;
  right: 19px;
  transform: translateY(-50%);
  color: #86ad9b;
  font-size: 23px;
  pointer-events: none;
}

.hint {
  margin: 10px 0 0;
  color: #98a7a1;
  font-size: 11px;
}

.suggestions {
  position: absolute;
  z-index: 10;
  top: calc(100% + 7px);
  left: 0;
  width: 100%;
  max-height: 280px;
  overflow-y: auto;
  margin: 0;
  padding: 7px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: white;
  box-shadow: 0 12px 30px #385c4d18;
  list-style: none;
}

.suggestions li {
  padding: 12px 14px;
  border-radius: 9px;
  cursor: pointer;
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.suggestions li:hover,
.suggestions li.active { background: var(--green-light); }

.suggestions small {
  color: var(--muted);
  font-size: 11px;
}

[hidden] { display: none !important; }

/* 結果表示 */
.result-card {
  margin-top: 20px;
  min-height: 190px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: white;
  text-align: center;
  box-shadow: 0 8px 30px #527e6a08;
}

.result-card.available {
  align-items: flex-start;
  border-color: #cce7d8;
  background: linear-gradient(120deg, #f1faf5, #fff);
  text-align: left;
}

.result-card.unavailable {
  align-items: flex-start;
  border-color: #f0dfc9;
  background: linear-gradient(120deg, #fff8ef, #fff);
  text-align: left;
}

.result-card.restricted {
  align-items: flex-start;
  border-color: var(--danger-border);
  background: linear-gradient(120deg, var(--danger-light), #fff);
  text-align: left;
}

.result-icon {
  display: grid;
  width: 44px;
  height: 44px;
  margin-bottom: 12px;
  place-items: center;
  border-radius: 15px;
  background: var(--green-light);
  color: var(--green-dark);
  font-size: 23px;
}

.result-card h2 {
  margin: 0;
  font-size: 17px;
}

.result-card > p {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.8;
}

.status {
  display: inline-block;
  padding: 8px 15px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 700;
}

.available .status {
  background: #dff1e6;
  color: #397c5b;
}

.unavailable .status {
  background: #fff0dc;
  color: #a16b2e;
}

.restricted .status {
  background: #fed7d7;
  color: #c53030;
}

.drug-name {
  margin: 16px 0 5px;
  font-size: 23px;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.drug-brands {
  color: #788c83;
  font-size: 13px;
  line-height: 1.8;
}

.warning {
  margin-top: 16px;
  padding: 13px 16px;
  border-left: 3px solid #e0ad69;
  border-radius: 6px;
  background: #fff4e6;
  color: #805e35;
  font-size: 12px;
  line-height: 1.8;
  width: 100%;
}

.warning.danger-warning {
  border-left-color: #e53e3e;
  background: #fff5f5;
  color: #9b2c2c;
}

.disclaimer {
  margin: 24px 5px 18px;
  color: #a0aea8;
  font-size: 11px;
  line-height: 1.7;
  text-align: center;
}

@media(max-width: 600px) {
  body { padding: 12px; }
  .header { min-height: 160px; padding: 25px 22px; border-radius: 20px; }
  .illustration { flex-basis: 105px; transform: scale(.75); transform-origin: right center; margin-left: -35px; }
  .header p.description { max-width: 230px; font-size: 11px; }
  .search-card { padding: 23px 18px; }
  .result-card { padding: 23px 19px; }
}
@media(max-width: 360px) {
  .illustration { display: none; }
}
</style>
</head>

<body>
<main class="container">

<header class="header">
  <div class="header-copy">
    <p class="header-label">YOKOHAMA KOKORO TO NEMURI CLINIC</p>
    <h1>院内薬剤検索</h1>
    <p class="description">
      横浜こころとねむりのクリニック<br>
      院内処方可否確認システム
    </p>
  </div>
  <div class="illustration" aria-hidden="true">
    <div class="medical-circle"></div>
    <div class="medical-cross">＋</div>
    <div class="pill pill-one"></div>
    <div class="pill pill-two"></div>
    <div class="small-circle"></div>
  </div>
</header>

<section class="search-card">
  <div class="section-heading">
    <span class="heading-icon">⌕</span>
    薬剤名を検索
  </div>
  <div class="search-box">
    <input id="search" type="search"
      placeholder="一般名・商品名を入力してください（例: アセナピン、コンサータ）"
      autocomplete="off">
    <span class="search-icon">⌕</span>
    <ul id="suggestions" class="suggestions" hidden></ul>
  </div>
  <p class="hint">一般名・商品名のどちらからでも検索・予測変換できます。</p>
</section>

<section id="result" class="result-card" aria-live="polite">
  <div class="result-icon">＋</div>
  <h2>薬剤名を入力してください</h2>
  <p>検索結果に当院での処方可否が表示されます。</p>
</section>

<p class="disclaimer">
  本ページは院内の登録リストを検索する補助ツールです。<br>
  処方の最終判断は院内ルールおよび診療上の判断に従ってください。
</p>

</main>
